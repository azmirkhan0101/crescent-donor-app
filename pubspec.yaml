name: cresent_charge_user_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  lottie: ^3.3.2
  vector_graphics: ^1.1.19
  internet_connection_checker_plus: ^2.9.1
  go_router: ^17.0.1
  gap: ^3.0.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  logger: ^2.6.2
  google_fonts: ^6.3.3
  get_it: ^9.2.0
  fpdart: ^1.2.0
  http: ^1.6.0
  mime: ^2.0.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4
  socket_io_client: ^3.1.3
  flutter_spinkit: ^5.2.2
  pinput: ^6.0.1
  flutter_secure_storage: ^10.0.0
  smart_stepper: ^0.0.7
  qr_flutter: ^4.1.0
  fl_chart: ^1.1.1
  dropdown_button2: ^2.3.9
  step_progress_indicator: ^1.0.2
  dotted_border: ^3.1.0
  device_preview: ^1.3.1
  fluttertoast: ^9.0.0
  skeletonizer: ^2.1.2
  flutter_stripe: ^12.1.1
  plaid_flutter: ^5.0.5
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.11.0
  # flutter_gen: ^5.11.0

flutter_gen:
  output: lib/core/custom_assets/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
  # Optional
  integrations:
    flutter_svg: true
    lottie: true

    #===========>>>>>>>>>> Flutter Gen Code ==============>>>>>>>>>>>
    # dart pub global activate flutter_gen
    # flutter pub run build_runner build --delete-conflicting-outputs

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/common/
    - assets/onboarding/
    - assets/bottom-nav/
    - assets/home/
    - assets/rewards/
    - assets/donation/
    - assets/profile/
  
